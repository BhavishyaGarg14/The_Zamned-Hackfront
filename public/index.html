<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Missing Rupee</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --fs:1;
  --ink:#0F172A;--mute:#64748B;--faint:#94A3B8;--navy:#343C6A;--blue:#1814F3;
  --line:#F1F5F9;--border:#E2E8F0;--bg:#F8FAFC;--card:#FFFFFF;--soft:#F5F7FA;
  --navtxt:#718EBF;--navhov:#E0E7FF;--pillbg:#EEF2FF;--bellbg:#FEF5F5;
  --green:#DCFCE7;--amber:#FEF3C7;--warn-txt:#92400E
}
[data-theme="dark"]{
  --ink:#F8FAFC;--mute:#94A3B8;--faint:#64748B;--navy:#F8FAFC;--blue:#4F46E5;
  --line:#334155;--border:#475569;--bg:#0F172A;--card:#1E293B;--soft:#334155;
  --navtxt:#94A3B8;--navhov:#334155;--pillbg:#312E81;--bellbg:#334155;
  --warn-txt:#78350F
}
html{font-size:calc(16px * var(--fs))}
*{box-sizing:border-box;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:200px 1fr;min-height:100vh;transition:background .15s,color .15s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
aside{background:var(--card);padding:25px 15px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
.logo{text-align:center;font-weight:700;font-size:1rem;color:var(--navy);margin-bottom:25px}
.logo img{max-width:160px;max-height:100px;border-radius:14px}
nav button{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:6px;border-radius:12px;font-weight:700;font-size:.875rem;color:var(--navtxt)}
nav button:hover{background:var(--navhov)}
nav button.on{background:#1814F3;color:#fff}
header{background:var(--card);height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:1.375rem;color:var(--navy)}
.actions{display:flex;align-items:center;gap:10px}
#status{font-size:.75rem;color:var(--faint);white-space:nowrap}
.pill{background:var(--pillbg);color:var(--blue);font-weight:700;font-size:.8125rem;padding:10px 16px;border-radius:20px}
[data-theme="dark"] .pill{color:#C7D2FE}
.pill:hover{background:var(--navhov)}
.pill[disabled]{opacity:.6;cursor:wait}
#gsearch{width:220px;height:40px;border:0;border-radius:20px;background:var(--soft);padding:0 16px;font-size:.75rem}
.circ{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;position:relative;font-size:1rem}
.circ:hover{background:var(--navhov)}
.circ img,.avatar{width:20px;height:20px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--soft)}
.bell{background:var(--bellbg)}
#bellN{position:absolute;top:-3px;right:-3px;z-index:2;background:#FF4D4F;color:#fff;font-size:.625rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;border:2px solid var(--card);display:grid;place-items:center;padding:0 4px;line-height:1}
#bellN[hidden]{display:none}
main{padding:20px 25px 40px}
.kick{font-size:.6875rem;font-weight:700;color:var(--faint);letter-spacing:.06em}
h2{font-size:1.625rem;margin:2px 0}
.sub{font-size:.8125rem;color:var(--mute);margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border-radius:16px;padding:20px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:15px;font-weight:700;color:#0F172A}
.card .l{font-size:.75rem;color:var(--mute)}
.card .v{font-size:1.5rem;font-weight:700;margin:4px 0}
.card .f{font-size:.6875rem;color:var(--faint)}
.charts{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px}
.chead h3{font-size:.9375rem;font-weight:700}
.chead select{height:28px;border:0;border-radius:6px;background:var(--soft);padding:0 10px;font-size:.6875rem;color:var(--ink)}
.csub{font-size:.6875rem;color:var(--faint);margin-bottom:12px}
.cwrap{position:relative;height:210px}
.box{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:20px;margin-bottom:16px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar input,.bar select{height:38px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:0 12px;font-size:.75rem}
.bar input{flex:1;min-width:200px}
#count{font-size:.75rem;color:var(--mute);margin-left:auto}
.head,.row{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr 20px;gap:12px;align-items:center}
.head{padding:0 16px 8px;font-size:.6875rem;font-weight:700;color:var(--faint)}
.row{width:100%;text-align:left;background:var(--card);border-radius:10px;padding:10px 16px;margin-bottom:8px;min-height:58px}
.row:hover{box-shadow:0 0 0 2px var(--navhov)}
.who{display:flex;gap:12px;align-items:center}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:1rem;flex:none;color:#1E293B}
.row small,.who small{display:block;font-size:.6875rem;color:var(--mute);margin-top:2px}
.tag{display:inline-block;font-size:.625rem;font-weight:700;padding:3px 8px;border-radius:10px}
.hi{background:var(--green);color:#166534}.md{background:var(--amber);color:#92400E}.lo{background:#FEE2E2;color:#991B1B}
.back{color:#0D9488;font-weight:700;font-size:.8125rem;margin-bottom:14px}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}
.hero .badge{width:56px;height:56px;font-size:1.375rem}
.big{font-size:1.625rem;font-weight:700}.big span{font-size:.875rem;color:var(--mute);font-weight:400}
.hist{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.8125rem}
.hist .d{width:110px;color:var(--mute)}.hist .t{flex:1}
.step{display:flex;gap:12px;margin:12px 0;font-size:.8125rem;line-height:1.5}
.step b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:.75rem;flex:none}
.pillgrey{display:inline-block;background:var(--soft);padding:6px 12px;border-radius:12px;font-size:.75rem;margin:8px 0}
.warn{background:var(--amber);color:var(--warn-txt);border-radius:10px;padding:12px 14px;font-size:.75rem;line-height:1.5;margin-top:14px}
.note{font-size:.6875rem;color:var(--faint);margin-top:10px}
.sep{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:.6875rem;font-weight:700;color:var(--mute)}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--border)}
.alert{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.alert .ai{width:36px;height:36px;border-radius:50%;background:#FEF2F2;display:grid;place-items:center}
.alert .tx{flex:1;min-width:220px}.alert .tx b{font-size:.8125rem}.alert .tx p{font-size:.6875rem;color:var(--mute);margin-top:3px}
.alert .meta{font-size:.6875rem;color:var(--mute)}
.alert button{color:#0D9488;font-weight:700;font-size:.75rem;padding:8px 12px;border-radius:8px}
.alert button:hover{background:var(--soft)}
.state{text-align:center;color:var(--mute);padding:60px 20px;font-size:.875rem}
.banner{background:#FEF2F2;color:#991B1B;border-radius:12px;padding:14px 16px;font-size:.8125rem;margin-bottom:16px}
.banner button{color:#1814F3;font-weight:700;margin-left:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #CBD5E1;border-top-color:#1814F3;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
/* Settings Modal */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:50;padding:16px}
.backdrop[hidden]{display:none}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;width:100%;max-width:420px;padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mhead h3{font-size:1.125rem;font-weight:700}
.mclose{width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:1rem;display:grid;place-items:center}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.mgrp+.mgrp{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.mgrp b{display:block;font-size:.8125rem;margin-bottom:2px}
.mgrp small{display:block;font-size:.6875rem;color:var(--mute);margin-bottom:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg button{padding:7px 6px;border-radius:8px;font-size:.75rem;font-weight:700;color:var(--mute)}
.seg button.on{background:#1814F3;color:#fff}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}
@media (max-width:860px){
 body{grid-template-columns:1fr}
 aside{position:static;height:auto;padding:12px;display:flex;align-items:center;gap:10px;overflow-x:auto}
 .logo{margin:0}.logo img{max-height:40px}
 nav{display:flex;gap:6px}nav button{white-space:nowrap;margin:0}
 header{height:auto;flex-wrap:wrap;padding:12px 16px;gap:10px;position:static}
 #gsearch{width:140px}
 .cards,.charts{grid-template-columns:1fr}
 .head{display:none}.row{grid-template-columns:1fr auto 14px}.row .c3,.row .c4{display:none}
 main{padding:16px}
}
</style>
</head>
<body>
<aside>
  <div class="logo" id="logoSlot"></div>
  <nav id="nav" aria-label="Main"></nav>
</aside>
<div>
  <header>
    <h1 id="title">Overview</h1>
    <div class="actions">
      <span id="status"></span>
      <button class="pill" id="refresh" title="Run the AI analysis again on your latest transactions">Re-analyze</button>
      <input id="gsearch" type="search" placeholder="Search for something" aria-label="Search merchants">
      <button class="circ" id="settings" title="Settings" aria-label="Settings"></button>
      <button class="circ bell" id="bell" title="Alerts" aria-label="Alerts"></button>
      <span class="avatar" id="profileSlot" aria-label="Profile"></span>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<div class="backdrop" id="modal" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function icon(baseName, fallback, w, h, radius = 0) {
  const exts = ['.png', '.jpeg', '.jpg'];
  const names = isDark() ? [`${baseName}_dark`, baseName] : [baseName];
  const urls = names.flatMap(n => exts.map(ext => `/assets/${encodeURIComponent(n + ext)}`));
  const style = `width:${w}px;height:${h}px;object-fit:contain${radius ? `;border-radius:${radius}px` : ''}`;
  return `<img src="${urls[0]}" alt="" style="${style}" data-fb="${esc(urls.slice(1).join('|'))}" data-txt="${esc(fallback)}" onerror="nextIcon(this)">`;
}
function nextIcon(img) {
  const list = img.dataset.fb ? img.dataset.fb.split('|') : [];
  if (list.length) {
    img.dataset.fb = list.slice(1).join('|');
    img.src = list[0];
  } else {
    img.replaceWith(document.createTextNode(img.dataset.txt || ''));
  }
}

const inr = n => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}).format(n);
const fmt = d => { const t = new Date(d+'T00:00:00Z'); return isNaN(t) ? d : t.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}); };
const PER_YEAR = {monthly:12,quarterly:4,annual:1,'bi-weekly':26};
const MONTHS = {monthly:1,quarterly:3,annual:12};
const TABS = [['dashboard','Dashboard','Overview'],['transactions','Transactions','Transactions'],['alerts','Alerts & Insights','Alerts & Insights']];
const SOURCES = {gemini:'Live analysis',cache:'Saved analysis',sample:'Sample data'};
const DEFAULT_STEPS = n => [`Log into your ${n} account on their official website or app.`,'Navigate to Account Settings or Subscription & Billing.',"Select your active plan and click 'Cancel Subscription' or 'Disable Auto-Renew'.",'Save the cancellation confirmation receipt for your records.'];

const S = {
  data:null, q:'', cat:'All categories', freq:'All frequencies', range:'6m',
  theme: localStorage.getItem('tmr_theme') || 'Light',
  scale: localStorage.getItem('tmr_scale') || '100%',
  error:false, loading:false
};

const annualCost = c => c.amount * (PER_YEAR[c.frequency] ?? 12);
const confidence = c => c.history.length >= 3 ? ['HIGH','hi'] : c.history.length === 2 ? ['MEDIUM','md'] : ['LOW','lo'];
function nextPayment(c){
  const t = new Date(c.date+'T00:00:00Z'); if (isNaN(t)) return c.date;
  if (c.frequency === 'bi-weekly') t.setUTCDate(t.getUTCDate()+14);
  else t.setUTCMonth(t.getUTCMonth()+(MONTHS[c.frequency] ?? 1));
  return t.toISOString().slice(0,10);
}
function alertChange(a){
  if (a.type==='price_hike') return `${inr(a.old_amount)} → ${inr(a.new_amount)} (+${a.pct}%)`;
  if (a.type==='trial_converted') return `₹0 → ${inr(a.new_amount)}`;
  if (a.type==='new') return `New (${inr(a.new_amount)})`;
  return `Frequency: ${a.frequency}`;
}
const ALERT_TITLE = {price_hike:a=>`${a.merchant} price increased`,trial_converted:()=>'Free trial converted',new:()=>'New recurring payment started',frequency_increased:()=>'Billing frequency increased'};

/* ---------- data ---------- */
async function load(refresh=false){
  S.loading = true; S.error = false; paintChrome(); if (!S.data) paint();
  const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 90000);
  try{
    const r = await fetch('/api/analysis'+(refresh?'?refresh=true':''),{signal:ctl.signal});
    if (!r.ok) throw new Error(r.status);
    S.data = await r.json();
  }catch(e){ S.error = true; }
  clearTimeout(timer); S.loading = false; paintChrome(); paint();
}

/* ---------- chrome (sidebar, header) ---------- */
function paintChrome(){
  const {view} = route();
  $('#nav').innerHTML = TABS.map(([k,l])=>`<button data-go="${k}" class="${k===view?'on':''}" ${k===view?'aria-current="page"':''}>${l}</button>`).join('');
  $('#title').textContent = TABS.find(t=>t[0]===view)[2];
  const b = $('#refresh'); b.disabled = S.loading; b.innerHTML = S.loading ? '<span class="spin"></span>Analyzing…' : 'Re-analyze';
  const m = S.data?.meta; $('#status').textContent = m?.source ? SOURCES[m.source] + (m.updated_at ? ' · '+new Date(m.updated_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '') : '';
  const n = S.data?.alerts.length || 0; $('#bellN').hidden = !n; $('#bellN').textContent = n;
}

/* ---------- routing: #dashboard | #transactions | #transactions/<id> | #alerts ---------- */
function route(){
  const [view='dashboard', id] = location.hash.slice(1).split('/');
  return {view: TABS.some(t=>t[0]===view) ? view : 'dashboard', id: id && decodeURIComponent(id)};
}
function go(path){ location.hash = path; }
addEventListener('hashchange', ()=>{ paintChrome(); paint(); scrollTo(0,0); });

/* ---------- screens ---------- */
function paint(){
  const v = $('#view'), {view,id} = route(), d = S.data;
  if (!d) { v.innerHTML = S.error ? errorBox() : '<div class="state"><span class="spin"></span>Analyzing your transactions. The first run can take a few seconds.</div>'; return; }
  const banner = S.error ? errorBox() : '';
  if (view==='dashboard') { v.innerHTML = banner + dashboard(d); renderCharts(d); }
  else if (view==='alerts') v.innerHTML = banner + alertsView(d);
  else { const c = id && d.commitments.find(x=>x.id===id); v.innerHTML = banner + (c ? detail(c) : listView(d)); if (!c) bindList(); }
}
const errorBox = () => `<div class="banner">We couldn't load your data. Check that the server is running, then try again.<button data-act="retry">Try again</button></div>`;

function dashboard(d){
  const m = d.metrics, card = (bg,ic,l,v,f)=>`<div class="card"><div class="ico" style="background:${bg}">${ic}</div><div class="l">${l}</div><div class="v">${v}</div><div class="f">${f}</div></div>`;
  return `<div class="kick">OVERVIEW</div><h2>Your money, uncovered.</h2><p class="sub">A clear view of the recurring payments quietly leaving your account.</p>
  <div class="cards">
   ${card('#E2E8F0', icon('recurring','🔄',20,20), 'Monthly recurring spend', inr(m.monthly), 'Across identified commitments')}
   ${card('#DCFCE7', icon('annual','₹',26,26), 'Annual commitment', inr(m.annual), 'Your recurring baseline')}
   ${card('#E0F2FE', icon('subscriptions','✓',25,25), 'Active subscriptions', m.active, `From ${m.merchants} merchant pattern${m.merchants===1?'':'s'}`)}
  </div>
  <div class="charts">
   <div class="card">
    <div class="chead"><h3>Recurring spend trend</h3>
     <select id="trendRange" aria-label="Time range">
      <option value="6m" ${S.range==='6m'?'selected':''}>Last 6 months</option>
      <option value="12m" ${S.range==='12m'?'selected':''}>Last 12 months</option>
      <option value="all" ${S.range==='all'?'selected':''}>All time</option>
     </select>
    </div>
    <p class="csub">Monthly run-rate from detected commitments</p>
    <div class="cwrap"><canvas id="trendChart"></canvas></div>
   </div>
   <div class="card">
    <div class="chead"><h3>Where it goes</h3></div>
    <p class="csub">Monthly by category</p>
    <div class="cwrap"><canvas id="catChart"></canvas></div>
   </div>
  </div>
  ${d.alerts.length ? `<div class="box" style="margin-top:16px"><b>${d.alerts.length} alert${d.alerts.length===1?'':'s'} need${d.alerts.length===1?'s':''} a look.</b> <button class="back" data-go="alerts" style="margin:0 0 0 8px">See alerts</button></div>` : ''}`;
}

let trendInst = null, catInst = null;
function fmtMonth(ym){
  const [y,m] = ym.split('-');
  const dt = new Date(Date.UTC(+y, +m-1, 1));
  return isNaN(dt) ? ym : `${dt.toLocaleString('en-US',{month:'short',timeZone:'UTC'})} '${y.slice(2)}`;
}

function renderCharts(d){
  if (typeof Chart === 'undefined') return;
  const dark = isDark();
  const tipBg = dark ? '#1E293B' : '#FFFFFF';
  const tipTxt = dark ? '#F8FAFC' : '#0F172A';
  const tipBdr = dark ? '#475569' : '#CBD5E1';
  const tickClr = dark ? '#94A3B8' : '#64748B';
  const gridClr = dark ? '#334155' : '#F1F5F9';
  const barClr = dark ? '#38BDF8' : '#1E293B';

  const sel = $('#trendRange');
  if (sel) sel.onchange = e => { S.range = e.target.value; renderCharts(d); };

  // 1. Recurring spend trend (line chart)
  const monthlySums = {};
  d.commitments.forEach(c => (c.history || []).forEach(h => {
    const k = h.date.slice(0, 7);
    monthlySums[k] = (monthlySums[k] || 0) + Number(h.amount || 0);
  }));
  const allKeys = Object.keys(monthlySums).sort();
  const keys = S.range === '6m' ? allKeys.slice(-6) : S.range === '12m' ? allKeys.slice(-12) : allKeys;

  if (trendInst) trendInst.destroy();
  trendInst = new Chart($('#trendChart'), {
    type: 'line',
    data: {
      labels: keys.map(fmtMonth),
      datasets: [{
        data: keys.map(k => monthlySums[k]),
        borderColor: '#10B981',
        backgroundColor: 'rgba(16, 185, 129, 0.12)',
        borderWidth: 2.5,
        fill: true,
        tension: 0.25,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: '#10B981'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#FFFFFF',
          titleColor: '#0F172A',
          bodyColor: '#0F172A',
          borderColor: '#CBD5E1',
          borderWidth: 1,
          padding: 10,
          displayColors: false,
          callbacks: {
            title: items => keys[items[0].dataIndex],
            label: ctx => `amount : ${inr(ctx.parsed.y)}`
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#64748B', font: { size: 11 } } },
        y: {
          beginAtZero: true,
          border: { display: false },
          grid: { color: '#F1F5F9' },
          ticks: { color: '#64748B', font: { size: 11 }, callback: v => inr(v) }
        }
      }
    }
  });

  // 2. Where it goes (horizontal category bar chart)
  const catTotals = {};
  d.commitments.forEach(c => {
    const monthly = (c.amount * (PER_YEAR[c.frequency] ?? 12)) / 12;
    catTotals[c.category] = (catTotals[c.category] || 0) + monthly;
  });
  const cats = Object.keys(catTotals).sort((a,b) => catTotals[b] - catTotals[a]);
  const vals = cats.map(k => Math.round(catTotals[k]));

  if (catInst) catInst.destroy();
  catInst = new Chart($('#catChart'), {
    type: 'bar',
    data: {
      labels: cats,
      datasets: [{
        data: vals,
        backgroundColor: isDark() ? '#38BDF8' : '#1E293B',
        borderRadius: 6,
        barThickness: 18
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: isDark() ? '#0F172A' : '#FFFFFF',
          titleColor: isDark() ? '#F8FAFC' : '#0F172A',
          bodyColor: isDark() ? '#F8FAFC' : '#0F172A',
          borderColor: isDark() ? '#475569' : '#CBD5E1',
          borderWidth: 1,
          padding: 10,
          displayColors: false,
          callbacks: {
            label: ctx => `amount : ${inr(ctx.parsed.x)}`
          }
        }
      },
      scales: {
        x: { display: false, beginAtZero: true },
        y: {
          border: { display: false },
          grid: { display: false },
          ticks: { color: isDark() ? '#CBD5E1' : '#475569', font: { size: 12 } }
        }
      }
    }
  });
}
function filtered(d){
  const q = S.q.toLowerCase().trim();
  return d.commitments.filter(c =>
    (!q || [c.name,c.category,c.frequency].some(x=>x.toLowerCase().includes(q))) &&
    (S.cat==='All categories' || c.category===S.cat) && (S.freq==='All frequencies' || c.frequency===S.freq));
}
function listView(d){
  const uniq = k => [...new Set(d.commitments.map(c=>c[k]))].sort();
  const opt = (arr,all,cur) => [all,...arr].map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
  return `<div class="kick">DISCOVERY</div><h2>All commitments</h2><p class="sub">Every recurring payment we found in your transaction history.</p>
  <div class="bar"><input id="q" type="search" placeholder="🔍  Search merchant or descriptor" value="${esc(S.q)}" aria-label="Search commitments">
   <select id="cat" aria-label="Category">${opt(uniq('category'),'All categories',S.cat)}</select>
   <select id="freq" aria-label="Frequency">${opt(uniq('frequency'),'All frequencies',S.freq)}</select><span id="count"></span></div>
  <div class="head"><span>MERCHANT</span><span>AMOUNT / FREQUENCY</span><span>LAST PAYMENT</span><span>CONFIDENCE</span><span></span></div>
  <div id="rows"></div>`;
}
function rows(){
  const list = filtered(S.data);
  $('#count').textContent = `${list.length} found`;
  $('#rows').innerHTML = list.length ? list.map(c=>{ const [cl,cls]=confidence(c); return `<button class="row" data-id="${esc(c.id)}">
    <span class="who"><span class="badge" style="background:${esc(c.bg)}">${esc(c.initial)}</span><span><b>${esc(c.name)}</b><small>${esc(c.frequency)} · ${esc(c.category)}</small></span></span>
    <span><b>${inr(c.amount)}</b><small>/${esc(c.frequency)}</small></span><span class="c3">${fmt(c.date)}</span><span class="c4"><span class="tag ${cls}">${cl}</span></span><i>›</i></button>`; }).join('')
    : `<div class="state">${S.data.commitments.length ? 'No commitments match these filters. Clear the search or pick "All".' : 'No recurring payments found yet. Add transactions to your database, then select Re-analyze.'}</div>`;
}
function bindList(){
  rows();
  $('#q').oninput = e => { S.q = e.target.value; $('#gsearch').value = S.q; rows(); };
  $('#cat').onchange = e => { S.cat = e.target.value; rows(); };
  $('#freq').onchange = e => { S.freq = e.target.value; rows(); };
}

function detail(c){
  const [cl,cls] = confidence(c), h = c.history, steps = c.cancellation_steps?.length ? c.cancellation_steps : DEFAULT_STEPS(c.name);
  return `<button class="back" data-go="transactions">←  All commitments</button>
  <div class="kick">INVESTIGATION</div><h2>${esc(c.name)}</h2><p class="sub">${esc(c.name.toUpperCase().replace(/\s/g,''))} · evidence-based recurring payment review</p>
  <div class="box hero"><div class="who"><span class="badge" style="background:${esc(c.bg)}">${esc(c.initial)}</span><div>
    <div class="big">${inr(c.amount)}<span> /${esc(c.frequency)}</span></div>
    <div class="sub" style="margin:4px 0 6px">Estimated next payment: ${fmt(nextPayment(c))}</div><span class="tag ${cls}">${cl} CONFIDENCE</span></div></div>
    <div style="text-align:right"><div class="sub" style="margin:0">Annual cost</div><div class="big">${inr(annualCost(c))}</div></div></div>
  <div class="box"><b>Payment history</b><p class="sub" style="margin:4px 0 10px">Matched ${h.length} payment${h.length===1?'':'s'} for ${esc(c.name)} with a ${esc(c.frequency)} billing pattern.</p>
    ${h.map((x,i)=>`<div class="hist"><span style="color:var(--faint)">•</span><span class="d">${fmt(x.date)}</span><span class="t">${esc(x.description)}</span><b>${inr(x.amount)}</b>${i===h.length-1?'<span class="tag hi">Latest</span>':''}</div>`).join('')}</div>
  <div class="box"><div class="kick">GUIDED CANCELLATION</div><h2 style="font-size:18px">How to stop this payment</h2>
    ${c.payment_mechanism ? `<span class="pillgrey">✓  Payment mechanism: ${esc(c.payment_mechanism)}</span>` : ''}
    ${steps.map((s,i)=>`<div class="step"><b>${i+1}</b><span>${esc(s)}</span></div>`).join('')}
    <div class="warn" style="display:flex;gap:8px;align-items:flex-start">${icon('warning','⚠️',20,20)}<span>Important distinction: Revoking a mandate may stop future debits but does not automatically terminate the underlying merchant contract.</span></div>
    <p class="note">Steps are AI-generated and may be out of date. Check the merchant's site before relying on them.</p></div>`;
}

function alertsView(d){
  const groups = {}; d.alerts.forEach(a => (groups[a.date] ??= []).push(a));
  const body = Object.keys(groups).sort().reverse().map(date => `<div class="sep">${fmt(date)}</div>` + groups[date].map(a=>`
   <div class="alert"><span class="ai">${icon('warning','⚠️',20,20)}</span><div class="tx"><b>${esc(ALERT_TITLE[a.type]?.(a) ?? a.type)}</b><p>${esc(a.message)}</p></div>
   <span class="meta">Merchant: ${esc(a.merchant)} &nbsp; Observed: ${esc(a.date)} &nbsp; Change: ${esc(alertChange(a))}</span>
   <button data-go="transactions/${encodeURIComponent(a.commitment_id)}">Investigate ↗</button></div>`).join('')).join('');
  return `<div class="kick">SIGNALS</div><h2>Alerts &amp; insights</h2><p class="sub">Understand what changed before it quietly costs you more.</p>` +
    (body || '<div class="state">No alerts detected in your transaction history.</div>');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-id],[data-act]'); if (!t) return;
  if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.id) go('transactions/'+encodeURIComponent(t.dataset.id));
  else if (t.dataset.act==='retry') load();
});
$('#refresh').onclick = () => load(true);
$('#bell').onclick = () => go('alerts');
$('#gsearch').oninput = e => {
  S.q = e.target.value;
  const {view,id} = route();
  if (view!=='transactions' || id) go('transactions'); else { const q=$('#q'); if (q) q.value = S.q; rows(); }
};

/* ---------- settings & theme ---------- */
const isDark = () => S.theme === 'Dark' || (S.theme === 'System' && matchMedia('(prefers-color-scheme: dark)').matches);

function paintStaticIcons() {
  $('#logoSlot').innerHTML = icon('App Logo', 'The Missing Rupee', 160, 100, 14);
  $('#settings').innerHTML = icon('settings', '⚙', 20, 20);
  const n = S.data?.alerts.length || 0;
  $('#bell').innerHTML = `${icon('bell', '🔔', 20, 20)}<span id="bellN" ${n ? '' : 'hidden'}>${n}</span>`;
  $('#profileSlot').innerHTML = icon('profile', '👤', 40, 40, 20);
}

function applyPrefs() {
  document.documentElement.dataset.theme = isDark() ? 'dark' : 'light';
  document.documentElement.style.setProperty('--fs', (parseInt(S.scale, 10) || 100) / 100);
  paintStaticIcons();
  if (S.data) paint();
}

function openSettings(){
  const themes = ['Light', 'Dark', 'System'];
  const scales = ['80%', '90%', '100%', '110%', '120%'];
  const m = $('#modal');
  m.hidden = false;
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Preferences">
    <div class="mhead"><h3>${icon('settings','⚙️',22,22)} Preferences</h3><button class="mclose" id="mClose" aria-label="Close">✕</button></div>
    <p class="sub" style="margin:0">Customize your app theme and text scaling.</p>
    <div class="mcard">
      <div class="mgrp">
        <b>Appearance Theme</b>
        <small>Choose between light, dark, or system mode.</small>
        <div class="seg">${themes.map(t => `<button data-theme="${t}" class="${S.theme===t?'on':''}">${t}</button>`).join('')}</div>
      </div>
      <div class="mgrp">
        <b>Font &amp; UI Scaling</b>
        <small>Adjust widget padding and typography size.</small>
        <div class="seg">${scales.map(sc => `<button data-scale="${sc}" class="${S.scale===sc?'on':''}">${sc}</button>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

$('#settings').onclick = openSettings;
$('#modal').onclick = e => {
  if (e.target.id === 'modal' || e.target.id === 'mClose') { $('#modal').hidden = true; return; }
  const t = e.target.closest('[data-theme]');
  if (t) { S.theme = t.dataset.theme; localStorage.setItem('tmr_theme', S.theme); applyPrefs(); openSettings(); }
  const sc = e.target.closest('[data-scale]');
  if (sc) { S.scale = sc.dataset.scale; localStorage.setItem('tmr_scale', S.scale); applyPrefs(); openSettings(); }
};
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) $('#modal').hidden = true; });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'System') applyPrefs(); });

applyPrefs();

paintChrome(); load();
</script>
</body>
</html>
